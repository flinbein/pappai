services:
  controller:
    build: .
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      HOST: 0.0.0.0
      PAPPAI_ORIGIN: http://localhost:3000
      PAPPAI_WEB_ROOT: /run/pappai/web
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    volumes:
      - platform:/var/lib/pappai
      - workspace:/workspace
      - ${PAPPAI_WEB_DIR:-./web-releases}:/run/pappai/web:ro
volumes:
  platform:
  workspace:
