services:
  controller:
    build: .
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      HOST: 0.0.0.0
      PAPPAI_ORIGIN: http://localhost:3000
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    volumes:
      - platform:/var/lib/pappai
      - workspace:/workspace
volumes:
  platform:
  workspace:
